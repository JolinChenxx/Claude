[Grid]
X1-grid 1 0.0 480 u 1200.0
X2-grid 1 0.0 480 u 1200.0
X3-grid 1 0.0 1 u 1.0

[Chombo Refinement]
Levels 4
Ref_ratio 2 2 2 2 2
Regrid_interval 2 2 2 2
Refine_thresh 0.3
Tag_buffer_size 3
Block_factor 8
Max_grid_size 32
Fill_ratio 0.75

[Time]
CFL 0.4
CFL_max_var 1.1
tstop 900
first_dt 1.e-6

[Solver]
Solver hllc

[Boundary]
X1-beg axisymmetric
X1-end outflow
X2-beg reflective
X2-end outflow
X3-beg outflow
X3-end outflow

[Static Grid Output]
uservar 0
dbl -1.0 -1 single_file
flt 5.0 -1 single_file
vtk -1.0 -1 single_file
tab -1.0 -1
ppm -1.0 -1
png -1.0 -1
log 100
analysis 5.0 -1

[Chombo HDF5 output]
Checkpoint_interval -1.0 0
Plot_interval -1.0 0

[Parameters]

E_UJ 90
R0_UM 20
