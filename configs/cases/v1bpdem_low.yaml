# v1p: v1n + vapour exit momentum (PREREG 2026-11-24 v1p).  Base v1n: v1k + v1j combination with energy-limited droplet release (low fluence): back pressure AND droplet upper bound (PREREG 2026-11-24 'combination').
name: v1bpdem_low
laser:
  energy: '@E_pulse_low'
  diameter_1e2: '@D_beam_low'
  fwhm: '@tau_fwhm'
target:
  model: knight_backpressure_v1k
  back_pressure: true      # v1k: PLAN v3 §3.2 v1 item (Knight with back pressure; no recondensation)
  droplets: upper          # v1j droplet upper bound (PREREG 2026-11-24 08:20)
  droplet_release: energy_limited   # v1p: v1n + vapour exit momentum (PREREG 2026-11-24 v1p).  Base v1n: evaporate only while the mixture stays >= T_boil
numerics:
  rings: 24
  r_max_over_w: 2.5
  t_end_ns: 400
  dt_ns: 0.05
  picard_relax: 0.5
