# v1rswf: v1rs with the measured temporal waveform of a comparable IPG YLP-HP source (61.7 ns, T036; NOT the paper laser) - scenario only (PREREG 2026-11-26 'waveform').
# v1rs: v1r (melt-depth droplets) + recondensation on the target (PREREG 2026-11-25 v1s). Base: v1r: v1n + droplets launched over the v1n window fly at the measured spatter speed and evaporate by gas heat transfer (PREREG 2026-11-25, user decision 2026-11-25).
name: v1rswf_low
laser:
  energy: '@E_pulse_low'
  diameter_1e2: '@D_beam_low'
  fwhm: '@tau_fwhm'
  waveform: data/exp/laser/waveform_ipg_ylp_hp_T3_fig6.csv   # measured comparable-device trace (scenario)
target:
  recondensation: true    # v1s: Hertz-Knudsen recondensation on the target (registry recondensation_model, cu_condensation_coeff)
  model: knight_backpressure_v1k
  back_pressure: true      # v1k: PLAN v3 §3.2 v1 item (Knight with back pressure; no recondensation)
  droplets: upper          # v1j droplet upper bound (PREREG 2026-11-24 08:20)
  droplet_release: energy_limited   # v1n: evaporate only while the mixture stays >= T_boil
  spatter_speed: '@cu_spatter_speed_low'   # v1r: measured rise speed of the spatter top (registry)
  droplet_size: melt_rp    # v1r: registry droplet_size_model (Rayleigh-Plateau of the melt layer)
numerics:
  rings: 24
  r_max_over_w: 2.5
  t_end_ns: 400
  dt_ns: 0.05
  picard_relax: 0.5
