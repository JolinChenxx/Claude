# v1m case (low fluence): v1bp_low + plasma.breakdown_2t = true (PREREG 2026-11-24 v1m, two-temperature avalanche breakdown).
name: v1bd_low
laser:
  energy: '@E_pulse_low'
  diameter_1e2: '@D_beam_low'
  fwhm: '@tau_fwhm'
target:
  model: knight_backpressure_v1k
  back_pressure: true      # v1k: PLAN v3 §3.2 v1 item (Knight with back pressure; no recondensation)
plasma:
  breakdown_2t: true       # v1m: Cu electron avalanche with quasi-steady T_e during the pulse
numerics:
  rings: 24
  r_max_over_w: 2.5
  t_end_ns: 400
  dt_ns: 0.05
  picard_relax: 0.5
