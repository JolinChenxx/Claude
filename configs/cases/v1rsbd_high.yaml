# v1rsbd: v1rs + v1m two-temperature avalanche breakdown during the pulse (PREREG 2026-11-26 T038; high-fluence retest T042). Base v1rs: v1r (melt-depth droplets) + recondensation on the target (PREREG 2026-11-25 v1s). Base: v1r: v1n + droplets launched over the v1n window fly at the measured spatter speed and evaporate by gas heat transfer (PREREG 2026-11-25, user decision 2026-11-25).
name: v1rsbd_high
laser:
  energy: '@E_pulse_high'
  diameter_1e2: '@D_beam_high'
  fwhm: '@tau_fwhm'
target:
  recondensation: true    # v1s: Hertz-Knudsen recondensation on the target (registry recondensation_model, cu_condensation_coeff)
  model: knight_backpressure_v1k
  back_pressure: true      # v1k: PLAN v3 §3.2 v1 item (Knight with back pressure; no recondensation)
  droplets: upper          # v1j droplet upper bound (PREREG 2026-11-24 08:20)
  droplet_release: energy_limited   # v1n: evaporate only while the mixture stays >= T_boil
  spatter_speed: '@cu_spatter_speed_high'   # v1r: measured rise speed of the spatter top (registry)
  droplet_size: melt_rp    # v1r: registry droplet_size_model (Rayleigh-Plateau of the melt layer)
plasma:
  breakdown_2t: true      # v1m (PREREG 2026-11-24)
numerics:
  rings: 24
  r_max_over_w: 2.5
  t_end_ns: 400
  dt_ns: 0.05
  picard_relax: 0.5
