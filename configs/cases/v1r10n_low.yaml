# v1r size scan (10 nm radius, sensitivity only): v1n + droplets launched over the v1n window fly at the measured spatter speed and evaporate by gas heat transfer (PREREG 2026-11-25, user decision 2026-11-25).
name: v1r10n_low
laser:
  energy: '@E_pulse_low'
  diameter_1e2: '@D_beam_low'
  fwhm: '@tau_fwhm'
target:
  model: knight_backpressure_v1k
  back_pressure: true      # v1k: PLAN v3 §3.2 v1 item (Knight with back pressure; no recondensation)
  droplets: upper          # v1j droplet upper bound (PREREG 2026-11-24 08:20)
  droplet_release: energy_limited   # v1n: evaporate only while the mixture stays >= T_boil
  spatter_speed: '@cu_spatter_speed_low'   # v1r: measured rise speed of the spatter top (registry)
  droplet_size: 10.0e-9   # v1r sensitivity scan (PREREG 2026-11-25): fixed launch radius, not a fit
numerics:
  rings: 24
  r_max_over_w: 2.5
  t_end_ns: 400
  dt_ns: 0.05
  picard_relax: 0.5
