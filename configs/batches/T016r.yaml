# T016r: T016 low-fluence members rerun with build v1d (kinetic limit on the Cu-air interdiffusion flux,
# registry diff_cuair_limiter); tables v1b unchanged. High-fluence members: separate batch after the user's decision.
name: T016r
pluto_exe: D:/sim_tools/pluto_lip/build_v1d/mpi/pluto.exe
mpiexec: C:/Program Files/Microsoft MPI/Bin/mpiexec.exe
tables: D:/sim_runs/tables/v1b
root: D:/sim_runs/T016r
numerics:
  runs:
    - {id: low_thin_G0,  case: configs/cases/v0_low.yaml,  grid: G0, nec: thin, tstop_ns: 1300, procs: 8,  picard: 2, src_on: 1}
    - {id: low_trap_G0,  case: configs/cases/v0_low.yaml,  grid: G0, nec: trap, tstop_ns: 1300, procs: 8,  picard: 2, src_on: 1}
    - {id: low_thin_G1,  case: configs/cases/v0_low.yaml,  grid: G1, nec: thin, tstop_ns: 1300, procs: 16, picard: 0, src_on: 1}
