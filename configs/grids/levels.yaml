# Grid levels (N grade: chosen by convergence only, never by agreement with experiment). Units: um.
# PLUTO segment syntax: [start, n, type(u|s|l), end]; 's' = stretched continuation of the previous spacing.
numerics:
  G0:
    x1: [[0.0, 60, u, 150.0], [150.0, 80, s, 1200.0]]
    x2: [[0.0, 100, u, 100.0], [100.0, 110, s, 1500.0]]
  G0w:   # T046 near-wall refinement test (PREREG 2026-11-28): G0 with 0.25 um cells in the first 20 um above the face
    x1: [[0.0, 60, u, 150.0], [150.0, 80, s, 1200.0]]
    x2: [[0.0, 80, u, 20.0], [20.0, 80, u, 100.0], [100.0, 110, s, 1500.0]]
  G1:
    x1: [[0.0, 120, u, 150.0], [150.0, 140, s, 1200.0]]
    x2: [[0.0, 200, u, 100.0], [100.0, 200, s, 1500.0]]
  G2:
    x1: [[0.0, 240, u, 150.0], [150.0, 260, s, 1200.0]]
    x2: [[0.0, 400, u, 100.0], [100.0, 380, s, 1500.0]]
  smoke:
    x1: [[0.0, 60, u, 300.0]]
