[Grid]
X1-grid 3 0.0 40 u 120.0 100 u 720.0 48 s 1800.0
X2-grid 3 0.0 40 u 120.0 130 u 900.0 48 s 2100.0
X3-grid 1 0.0 1 u 1.0
[Time]
CFL 0.25
CFL_par 0.25
CFL_max_var 1.05
tstop 1000.0
first_dt 0.0001
[Solver]
Solver hllc
[Boundary]
X1-beg axisymmetric
X1-end outflow
X2-beg reflective
X2-end outflow
X3-beg outflow
X3-end outflow
[Static Grid Output]
uservar 1 temperature
dbl 100.0 -1 single_file
flt 5.0 -1 single_file
vtk -1.0 -1 single_file
tab -1.0 -1
ppm -1.0 -1
png -1.0 -1
log 200
analysis 5.0 -1
[Parameters]

MASS_NG 5
ENERGY_UJ 40
WAIST_UM 22
KINETIC_FRAC 0.02
TAIL_FRAC 0.15
TAIL_NS 70
LINE_WIDTH_NM 0.2
COOLING_SCALE 1
SOURCE_HEIGHT_UM 6
