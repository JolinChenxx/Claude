# lipsim runtime environment (same file for cloud Linux and the Windows workstation)
name: lipsim
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy>=1.26
  - scipy>=1.12
  - numba>=0.60
  - tbb
  - h5py
  - pyyaml
  - pandas
  - pillow
  - scikit-image
  - scikit-learn
  - matplotlib
  - salib
  - emcee
  - pytest
